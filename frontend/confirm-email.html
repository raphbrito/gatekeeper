<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Confirmar e-mail | Gatekeeper</title><link rel="stylesheet" href="assets/css/main.css"></head><body><main><h1>Confirmando e-mail</h1><p id="message" class="message" role="status">Aguarde…</p><p class="links"><a href="login.html">Ir para login</a></p></main><script src="assets/js/config.js"></script><script src="assets/js/session.js"></script><script src="assets/js/api.js"></script><script src="assets/js/app.js"></script><script>(async()=>{const message=document.querySelector('#message'),token=queryToken();if(!token)return showMessage(message,'Link inválido.',true);try{showMessage(message,(await Api.request('confirm-email','POST',{token})).message)}catch(error){showMessage(message,error.message,true)}})();</script></body></html>
