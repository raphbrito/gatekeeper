<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Redefinir senha | Gatekeeper</title><link rel="stylesheet" href="assets/css/main.css"></head><body><main><h1>Redefinir senha</h1><form id="reset-form"><label>Nova senha<input name="novaSenha" type="password" minlength="8" required autocomplete="new-password"></label><label>Confirmar nova senha<input name="confirmarSenha" type="password" minlength="8" required autocomplete="new-password"></label><button>Salvar nova senha</button></form><p id="message" class="message" role="status"></p><p class="links"><a href="login.html">Voltar ao login</a></p></main><script src="assets/js/config.js"></script><script src="assets/js/session.js"></script><script src="assets/js/api.js"></script><script src="assets/js/app.js"></script><script>const message=document.querySelector('#message');document.querySelector('#reset-form').addEventListener('submit',async e=>{e.preventDefault();const data={...Object.fromEntries(new FormData(e.target)),token:queryToken()};if(!data.token)return showMessage(message,'Link inválido.',true);try{showMessage(message,(await Api.request('reset-password','POST',data)).message);e.target.reset()}catch(error){showMessage(message,error.message,true)}});</script></body></html>
