<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administrar usuarios | Gatekeeper</title><link rel="stylesheet" href="assets/css/main.css"></head><body><main><h1>Usuarios</h1><p class="links"><a href="admin-convites.html">Enviar convite</a></p><p id="message" class="message" role="status"></p><div id="users">Carregando...</div></main><script src="assets/js/config.js"></script><script src="assets/js/session.js"></script><script src="assets/js/api.js"></script><script src="assets/js/app.js"></script><script>const message=document.querySelector('#message'),users=document.querySelector('#users');function esc(v){const e=document.createElement('span');e.textContent=v||'';return e.innerHTML}async function load(){try{const result=await Api.request('admin-users','GET',{},true);users.innerHTML=result.data.users.map(u=>`<article><strong>${esc(u.name)} ${esc(u.lastName)}</strong><br><small>${esc(u.email)} · ${esc(u.status)}</small><p><button data-user="${esc(u.id)}">Excluir usuario</button></p></article>`).join('')||'<p>Nenhum usuario.</p>';users.querySelectorAll('button[data-user]').forEach(button=>button.addEventListener('click',async()=>{if(!confirm('Excluir este usuario e suas sessoes?'))return;try{const result=await Api.request('admin-delete-user','POST',{userId:button.dataset.user},true);showMessage(message,result.message);load()}catch(error){showMessage(message,error.message,true)}}))}catch(error){Session.clear();location.replace('login.html')}}load();</script></body></html>
