<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Enviar convite | Gatekeeper</title><link rel="stylesheet" href="assets/css/main.css"></head><body><main><h1>Enviar convite</h1><section id="login-section"><p>Entre com sua conta administradora para enviar um convite.</p><form id="login-form"><label>E-mail<input name="email" type="email" required autocomplete="email"></label><label>Senha<input name="senha" type="password" required autocomplete="current-password"></label><button>Entrar</button></form></section><section id="invite-section" hidden><p>Informe o e-mail de quem criara o acesso.</p><form id="invite-form"><label>E-mail<input name="email" type="email" required autocomplete="email"></label><button>Enviar convite</button></form></section><p id="message" class="message" role="status"></p></main><script src="assets/js/config.js"></script><script src="assets/js/session.js"></script><script src="assets/js/api.js"></script><script src="assets/js/app.js"></script><script>const message=document.querySelector('#message'),loginSection=document.querySelector('#login-section'),inviteSection=document.querySelector('#invite-section');async function showInviteForm(){try{await Api.request('profile','GET',{},true);loginSection.hidden=true;inviteSection.hidden=false}catch(_){Session.clear();loginSection.hidden=false;inviteSection.hidden=true}}document.querySelector('#login-form').addEventListener('submit',async e=>{e.preventDefault();try{const result=await Api.request('login','POST',Object.fromEntries(new FormData(e.target)));Session.save(result.data.token);await showInviteForm()}catch(error){showMessage(message,error.message,true)}});document.querySelector('#invite-form').addEventListener('submit',async e=>{e.preventDefault();try{const result=await Api.request('create-registration-invite','POST',Object.fromEntries(new FormData(e.target)),true);showMessage(message,result.message);e.target.reset()}catch(error){showMessage(message,error.message,true)}});showInviteForm();</script></body></html>
