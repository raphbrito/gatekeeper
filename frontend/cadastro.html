<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cadastro | Gatekeeper</title><link rel="stylesheet" href="assets/css/main.css"></head><body><main><h1>Criar conta</h1><form id="register-form"><label>Nome<input name="nome" required autocomplete="given-name"></label><label>Sobrenome<input name="sobrenome" required autocomplete="family-name"></label><label>E-mail<input name="email" type="email" required autocomplete="email"></label><label>Senha<input name="senha" type="password" minlength="8" required autocomplete="new-password"></label><label>Confirmar senha<input name="confirmarSenha" type="password" minlength="8" required autocomplete="new-password"></label><button>Cadastrar</button></form><p id="message" class="message" role="status"></p><p class="links"><a href="login.html">Já tenho uma conta</a></p></main><script src="assets/js/config.js"></script><script src="assets/js/session.js"></script><script src="assets/js/api.js"></script><script src="assets/js/app.js"></script><script>redirectIfLoggedIn();const message=document.querySelector('#message');document.querySelector('#register-form').addEventListener('submit',async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));if(data.senha!==data.confirmarSenha)return showMessage(message,'As senhas não coincidem.',true);try{showMessage(message,(await Api.request('register','POST',data)).message);e.target.reset()}catch(error){showMessage(message,error.message,true)}});</script></body></html>
