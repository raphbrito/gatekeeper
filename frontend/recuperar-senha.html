<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recuperar senha | Gatekeeper</title><link rel="stylesheet" href="assets/css/main.css"></head><body><main><h1>Recuperar senha</h1><form id="forgot-form"><label>E-mail<input name="email" type="email" required autocomplete="email"></label><button>Enviar instruções</button></form><p id="message" class="message" role="status"></p><p class="links"><a href="login.html">Voltar ao login</a></p></main><script src="assets/js/config.js"></script><script src="assets/js/session.js"></script><script src="assets/js/api.js"></script><script src="assets/js/app.js"></script><script>const message=document.querySelector('#message');document.querySelector('#forgot-form').addEventListener('submit',async e=>{e.preventDefault();try{showMessage(message,(await Api.request('forgot-password','POST',Object.fromEntries(new FormData(e.target)))).message)}catch(error){showMessage(message,error.message,true)}});</script></body></html>
