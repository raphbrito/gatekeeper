<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar | Gatekeeper</title><link rel="stylesheet" href="assets/css/main.css"></head><body><main><h1>Entrar</h1><form id="login-form"><label>E-mail<input name="email" type="email" required autocomplete="email"></label><label>Senha<input name="senha" type="password" required autocomplete="current-password"></label><button>Entrar</button></form><p id="message" class="message" role="status"></p><nav class="links"><a href="cadastro.html">Criar conta</a><a href="recuperar-senha.html">Esqueci minha senha</a><a href="#" id="resend">Reenviar confirmação</a></nav></main><script src="assets/js/config.js"></script><script src="assets/js/session.js"></script><script src="assets/js/api.js"></script><script src="assets/js/app.js"></script><script>
redirectIfLoggedIn(); const message=document.querySelector('#message');
document.querySelector('#login-form').addEventListener('submit', async event=>{event.preventDefault();try{const result=await Api.request('login','POST',Object.fromEntries(new FormData(event.target)));Session.save(result.data.token);location.replace('perfil.html')}catch(error){showMessage(message,error.message,true)}});
document.querySelector('#resend').addEventListener('click',async event=>{event.preventDefault();const email=prompt('Informe seu e-mail:');if(!email)return;try{const result=await Api.request('resend-verification-email','POST',{email});showMessage(message,result.message)}catch(error){showMessage(message,error.message,true)}});
</script></body></html>
