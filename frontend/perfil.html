<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Perfil | Gatekeeper</title><link rel="stylesheet" href="assets/css/main.css"></head><body><main><h1>Meu perfil</h1><p id="welcome"></p><form id="profile-form"><label>Nome<input name="nome" required></label><label>Sobrenome<input name="sobrenome" required></label><label>E-mail<input name="email" type="email" disabled></label><button>Salvar perfil</button></form><hr><h2>Alterar e-mail</h2><form id="email-form"><label>Novo e-mail<input name="email" type="email" required></label><label>Senha atual<input name="senha" type="password" required autocomplete="current-password"></label><button>Enviar confirmação</button></form><hr><h2>Alterar senha</h2><form id="password-form"><label>Senha atual<input name="senhaAtual" type="password" required autocomplete="current-password"></label><label>Nova senha<input name="novaSenha" type="password" minlength="8" required autocomplete="new-password"></label><label>Confirmar senha<input name="confirmarSenha" type="password" minlength="8" required autocomplete="new-password"></label><button>Alterar senha</button></form><p id="message" class="message" role="status"></p><p class="links"><a href="#" id="logout">Sair</a></p></main><script src="assets/js/config.js"></script><script src="assets/js/session.js"></script><script src="assets/js/api.js"></script><script src="assets/js/app.js"></script><script>
Session.requireLogin(); const message=document.querySelector('#message');
async function loadProfile(){try{const result=await Api.request('profile','GET',{},true),user=result.data.user;document.querySelector('#welcome').textContent=`Olá, ${user.name}.`;for(const [key,value] of Object.entries({nome:user.name,sobrenome:user.lastName,email:user.email}))document.querySelector(`#profile-form [name="${key}"]`).value=value}catch(error){Session.clear();location.replace('login.html')}} loadProfile();
async function submit(form,route,method='POST'){try{const data=Object.fromEntries(new FormData(form));if(route==='change-password'&&data.novaSenha!==data.confirmarSenha)throw new Error('As senhas não coincidem.');const result=await Api.request(route,method,data,true);showMessage(message,result.message);form.reset();if(route==='profile')loadProfile()}catch(error){showMessage(message,error.message,true)}}
document.querySelector('#profile-form').addEventListener('submit',e=>{e.preventDefault();submit(e.target,'profile','PATCH')});document.querySelector('#email-form').addEventListener('submit',e=>{e.preventDefault();submit(e.target,'change-email')});document.querySelector('#password-form').addEventListener('submit',e=>{e.preventDefault();submit(e.target,'change-password')});document.querySelector('#logout').addEventListener('click',async e=>{e.preventDefault();try{await Api.request('logout','POST',{},true)}finally{Session.clear();location.replace('login.html')}});
</script></body></html>
