<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Criar acesso | Gatekeeper</title><link rel="stylesheet" href="assets/css/main.css"></head><body><main><h1>Criar seu acesso</h1><p>Defina seus dados e uma senha para concluir o cadastro.</p><form id="invite-form"><label>Nome<input name="nome" required autocomplete="given-name"></label><label>Sobrenome<input name="sobrenome" required autocomplete="family-name"></label><label>Senha<input name="senha" type="password" minlength="8" required autocomplete="new-password"></label><label>Confirmar senha<input name="confirmarSenha" type="password" minlength="8" required autocomplete="new-password"></label><button>Concluir cadastro</button></form><p id="message" class="message" role="status"></p><p class="links"><a href="login.html">Ir para login</a></p></main><script src="assets/js/config.js"></script><script src="assets/js/api.js"></script><script src="assets/js/app.js"></script><script>const message=document.querySelector('#message'),form=document.querySelector('#invite-form'),token=queryToken();if(!token){form.hidden=true;showMessage(message,'Link de convite invalido.',true)}form.addEventListener('submit',async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(form));if(data.senha!==data.confirmarSenha)return showMessage(message,'As senhas nao coincidem.',true);try{const result=await Api.request('accept-registration-invite','POST',{...data,token});showMessage(message,result.message);form.reset();form.querySelector('button').disabled=true;setTimeout(()=>location.href='login.html',3000)}catch(error){showMessage(message,error.message,true)}});</script></body></html>
